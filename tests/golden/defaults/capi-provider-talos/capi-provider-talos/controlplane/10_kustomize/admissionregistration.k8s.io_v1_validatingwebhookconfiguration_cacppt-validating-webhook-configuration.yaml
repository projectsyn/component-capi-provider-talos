apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: syn-cluster-api/cacppt-serving-cert
  labels:
    app.kubernetes.io/managed-by: commodore
    cluster.x-k8s.io/provider: control-plane-talos
  name: cacppt-validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: cacppt-webhook-service
      namespace: syn-cluster-api
      path: /validate-controlplane-cluster-x-k8s-io-v1alpha3-taloscontrolplane
  failurePolicy: Fail
  name: validate.taloscontrolplane.controlplane.cluster.x-k8s.io
  rules:
  - apiGroups:
    - controlplane.cluster.x-k8s.io
    apiVersions:
    - v1alpha3
    operations:
    - CREATE
    - UPDATE
    - DELETE
    resources:
    - taloscontrolplanes
  sideEffects: None
