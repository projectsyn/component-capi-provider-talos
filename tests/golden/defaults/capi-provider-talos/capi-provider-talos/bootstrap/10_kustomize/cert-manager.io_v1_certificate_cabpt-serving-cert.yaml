apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    app.kubernetes.io/managed-by: commodore
    cluster.x-k8s.io/provider: bootstrap-talos
  name: cabpt-serving-cert
  namespace: syn-cluster-api
spec:
  dnsNames:
  - cabpt-webhook-service.syn-cluster-api.svc
  - cabpt-webhook-service.syn-cluster-api.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: cabpt-selfsigned-issuer
  secretName: cabpt-webhook-service-cert
